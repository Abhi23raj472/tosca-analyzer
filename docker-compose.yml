services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tosca
      POSTGRES_PASSWORD: tosca
      POSTGRES_DB: tosca
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tosca"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tosca:tosca@db:5432/tosca
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
